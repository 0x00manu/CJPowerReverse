[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -Werror=return-type

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<MonitorProtocol.cpp>
build_flags =
    -Wall
    -Wextra
    -Werror
